<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Training Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 to-black min-h-screen">
    <div class="flex min-h-screen">
        <!-- Sidebar with months -->
        <aside class="w-64 bg-gray-800 p-4 flex-shrink-0">
            <div class="flex justify-center gap-4 mb-4">
                <button id="year2026" onclick="selectYear(2026)" class="text-xl font-bold text-white bg-red-600 px-4 py-2 rounded-lg">2026</button>
                <button id="year2027" onclick="selectYear(2027)" class="text-xl font-bold text-white bg-gray-700 px-4 py-2 rounded-lg hover:bg-gray-600">2027</button>
            </div>
            <div id="monthNavigation" class="space-y-2">
                <!-- Months will be generated by JavaScript -->
            </div>
        </aside>

        <!-- Login Modal -->
        <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4 shadow-xl">
                <h3 class="text-xl font-bold text-gray-800 mb-4">Login</h3>
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Username:</label>
                    <input 
                        type="text" 
                        id="loginUsername" 
                        placeholder="Enter username" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500"
                    >
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Password:</label>
                    <input 
                        type="password" 
                        id="loginPassword" 
                        placeholder="Enter password" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500"
                    >
                </div>
                <button 
                    onclick="login()" 
                    class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-lg transition"
                >
                    Login
                </button>
            </div>
        </div>

        <!-- Main content -->
        <main id="mainContent" class="flex-1 p-8 hidden">
            <!-- Header -->
            <header class="flex items-center justify-center mb-8 gap-4">
                <img src="BBC logo.jpeg" alt="BBC Logo" class="h-40 w-auto">
                <div>
                    <h1 class="text-4xl font-bold text-red-600 mb-2">🏀 Ballincollig Basketball Club</h1>
                    <p class="text-gray-400 ml-16">Click a free slot to book your training session</p>
                </div>
            </header>

            <!-- View Controls -->
            <div class="flex flex-col gap-4 mb-6">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <label class="text-gray-700 font-semibold">Venue:</label>
                        <select onchange="selectSchool(this.value)" id="schoolDropdown" class="px-4 py-2 rounded-lg border border-gray-300 bg-white">
                            <option value="Colaiste Choilm" selected>Colaiste Choilm</option>
                            <option value="Ballincollig Community School">Ballincollig Community School</option>
                            <option value="Bishopstown Community School">Bishopstown Community School</option>
                        </select>
                    </div>
                    <button onclick="logout()" class="px-4 py-2 rounded-lg bg-gray-700 text-white hover:bg-gray-600 transition">Logout</button>
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex gap-2">
                        <button onclick="setViewMode('weekly')" id="viewWeekly" class="px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700 transition font-semibold">Weekly View</button>
                        <button onclick="setViewMode('monthly')" id="viewMonthly" class="px-4 py-2 rounded-lg bg-gray-700 text-white hover:bg-gray-600 transition">Monthly View</button>
                    </div>
                    <div id="weekSelector" class="flex items-center gap-2">
                        <label class="text-gray-700 font-semibold">Week:</label>
                        <select onchange="selectWeek(this.value)" id="weekDropdown" class="px-4 py-2 rounded-lg border border-gray-300 bg-white">
                            <option value="1">Week 1</option>
                            <option value="2">Week 2</option>
                            <option value="3">Week 3</option>
                            <option value="4">Week 4</option>
                            <option value="5">Week 5</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Schedule Grid -->
            <div id="schedule" class="grid gap-4">
                <!-- Grid will be generated by JavaScript -->
            </div>

        <!-- Booking Modal -->
        <div id="bookingModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
            <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4 shadow-xl">
                <h3 class="text-xl font-bold text-gray-800 mb-4">Book Training Slot</h3>
                <p id="modalSlotInfo" class="text-gray-600 mb-4"></p>
                
                <!-- Time selection (for monthly view) -->
                <div id="timeSelection" class="mb-4 hidden">
                    <label class="block text-gray-700 font-semibold mb-2">Select Time:</label>
                    <select id="timeDropdown" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500">
                        <!-- Time options will be populated by JavaScript -->
                    </select>
                </div>
                
                <!-- Duration selection -->
                <div id="durationSelection" class="mb-4 hidden">
                    <label class="block text-gray-700 font-semibold mb-2">Duration:</label>
                    <select id="durationDropdown" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500">
                        <option value="30">30 minutes</option>
                        <option value="60" selected>1 hour</option>
                        <option value="90">1.5 hours</option>
                        <option value="120">2 hours</option>
                    </select>
                </div>
                
                <input 
                    type="text" 
                    id="playerName" 
                    placeholder="Enter your name" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 mb-4"
                >
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Booking Type:</label>
                    <div class="flex gap-4">
                        <label class="flex items-center">
                            <input type="radio" name="bookingType" value="single" checked class="mr-2">
                            <span class="text-gray-700">One-time</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="bookingType" value="recurring" class="mr-2">
                            <span class="text-gray-700">Recurring (weekly)</span>
                        </label>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Gender:</label>
                    <div class="flex gap-4">
                        <label class="flex items-center">
                            <input type="radio" name="gender" value="Boys" checked class="mr-2">
                            <span class="text-gray-700">Boys</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="gender" value="Girls" class="mr-2">
                            <span class="text-gray-700">Girls</span>
                        </label>
                    </div>
                </div>
                <div class="flex gap-3">
                    <button 
                        onclick="confirmBooking()" 
                        class="flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-lg transition"
                    >
                        Confirm Booking
                    </button>
                    <button 
                        onclick="closeModal()" 
                        class="flex-1 bg-gray-700 hover:bg-gray-800 text-white font-semibold py-2 px-4 rounded-lg transition"
                    >
                        Cancel
                    </button>
                </div>
            </div>
        </div>

        <!-- Unbooking Options Modal -->
        <div id="unbookModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
            <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4 shadow-xl">
                <h3 class="text-xl font-bold text-gray-800 mb-4">Unbooking Options</h3>
                <p id="unbookModalInfo" class="text-gray-600 mb-4"></p>
                <div class="flex flex-col gap-3">
                    <button 
                        onclick="unbookSingleInstanceChoice()" 
                        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition"
                    >
                        Unbook this instance only
                    </button>
                    <button 
                        onclick="unbookRecurringChoice()" 
                        class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-lg transition"
                    >
                        Remove entire recurring booking
                    </button>
                    <button 
                        onclick="closeUnbookModal()" 
                        class="bg-gray-700 hover:bg-gray-800 text-white font-semibold py-2 px-4 rounded-lg transition"
                    >
                        Cancel
                    </button>
                </div>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="fixed bottom-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg hidden transition">
            <p id="toastMessage"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
