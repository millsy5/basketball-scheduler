<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Basketball Training Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 to-black min-h-screen overflow-x-hidden">

        <!-- Login Modal -->
        <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4 shadow-xl">
                <h3 class="text-xl font-bold text-gray-800 mb-4">Login</h3>
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Username:</label>
                    <input 
                        type="text" 
                        id="loginUsername" 
                        placeholder="Enter username" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500"
                    >
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Password:</label>
                    <input 
                        type="password" 
                        id="loginPassword" 
                        placeholder="Enter password" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500"
                    >
                </div>
                <button 
                    onclick="login()" 
                    class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-lg transition"
                >
                    Login
                </button>
            </div>
        </div>

        <!-- Main content -->
        <main id="mainContent" class="flex-1 p-2 hidden overflow-x-hidden w-full h-screen flex flex-col">
            <!-- Header -->
            <header class="flex items-center justify-between mb-2 flex-shrink-0">
                <div class="flex items-center gap-2">
                    <img src="BBC logo.jpeg" alt="BBC Logo" class="h-10 w-auto">
                    <h1 class="text-lg font-bold text-red-600 whitespace-nowrap">🏀 Ballincollig Basketball Club</h1>
                </div>
            </header>

            <!-- View Controls -->
            <div class="flex items-center justify-between mb-2 flex-shrink-0">
                <div class="flex items-center gap-2 flex-1">
                    <label class="text-gray-300 font-semibold text-xs">Venue:</label>
                    <select onchange="selectSchool(this.value)" id="schoolDropdown" class="px-2 py-1 rounded-lg border border-gray-300 bg-white text-xs flex-1 max-w-[200px]">
                        <option value="Colaiste Choilm" selected>Colaiste Choilm</option>
                        <option value="Ballincollig Community School">Ballincollig Community School</option>
                        <option value="Bishopstown Community School">Bishopstown Community School</option>
                    </select>
                </div>
                <div class="flex items-center gap-2 flex-shrink-0">
                    <button onclick="previousMonth()" class="px-2 py-1 rounded-lg bg-gray-700 text-white hover:bg-gray-600 transition text-xs">←</button>
                    <span id="currentMonthYear" class="text-white font-semibold text-xs whitespace-nowrap"></span>
                    <button onclick="nextMonth()" class="px-2 py-1 rounded-lg bg-gray-700 text-white hover:bg-gray-600 transition text-xs">→</button>
                </div>
            </div>
            
            <!-- Logout button -->
            <div class="flex justify-end mb-2 flex-shrink-0">
                <button onclick="logout()" class="px-3 py-1 rounded-lg bg-gray-700 text-white hover:bg-gray-600 transition text-xs">Logout</button>
            </div>

            <!-- Schedule Grid -->
            <div id="schedule" class="grid gap-4 overflow-hidden overflow-x-hidden flex-1 overflow-y-hidden">
                <!-- Grid will be generated by JavaScript -->
            </div>

        <!-- Booking Modal -->
        <div id="bookingModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
            <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4 shadow-xl">
                <h3 class="text-xl font-bold text-gray-800 mb-4">Book Training Slot</h3>
                <p id="modalSlotInfo" class="text-gray-600 mb-4"></p>
                
                <!-- Time selection (for monthly view) -->
                <div id="timeSelection" class="mb-4 hidden">
                    <label class="block text-gray-700 font-semibold mb-2">Select Time:</label>
                    <select id="timeDropdown" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500">
                        <!-- Time options will be populated by JavaScript -->
                    </select>
                </div>
                
                <!-- Duration selection -->
                <div id="durationSelection" class="mb-4 hidden">
                    <label class="block text-gray-700 font-semibold mb-2">Duration:</label>
                    <select id="durationDropdown" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500">
                        <option value="30">30 minutes</option>
                        <option value="60" selected>1 hour</option>
                        <option value="90">1.5 hours</option>
                        <option value="120">2 hours</option>
                    </select>
                </div>
                
                <input 
                    type="text" 
                    id="playerName" 
                    placeholder="Enter booking information" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 mb-4"
                >
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Booking Type:</label>
                    <div class="flex gap-4">
                        <label class="flex items-center">
                            <input type="radio" name="bookingType" value="single" checked class="mr-2">
                            <span class="text-gray-700">One-time</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="bookingType" value="recurring" class="mr-2">
                            <span class="text-gray-700">Recurring (weekly)</span>
                        </label>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Gender:</label>
                    <div class="flex gap-4">
                        <label class="flex items-center">
                            <input type="radio" name="gender" value="Boys" checked class="mr-2">
                            <span class="text-gray-700">Boys</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="gender" value="Girls" class="mr-2">
                            <span class="text-gray-700">Girls</span>
                        </label>
                    </div>
                </div>
                <div class="flex gap-3">
                    <button 
                        onclick="confirmBooking()" 
                        class="flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-lg transition"
                    >
                        Confirm Booking
                    </button>
                    <button 
                        onclick="closeModal()" 
                        class="flex-1 bg-gray-700 hover:bg-gray-800 text-white font-semibold py-2 px-4 rounded-lg transition"
                    >
                        Cancel
                    </button>
                </div>
            </div>
        </div>

        <!-- Day Detail Modal -->
        <div id="dayDetailModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
            <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4 shadow-xl">
                <div class="flex items-center justify-between mb-4">
                    <h3 id="dayDetailTitle" class="text-xl font-bold text-gray-800"></h3>
                    <button onclick="closeDayDetailModal()" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
                </div>
                <div id="dayBookingsList" class="space-y-2 mb-4 max-h-60 overflow-y-auto">
                    <!-- Bookings will be populated by JavaScript -->
                </div>
                <button 
                    onclick="openBookingModalFromDayDetail()" 
                    class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-lg transition"
                >
                    + Add Booking
                </button>
            </div>
        </div>

        <!-- Unbook Options Modal -->
        <div id="unbookOptionsModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
            <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4 shadow-xl">
                <h3 class="text-xl font-bold text-gray-800 mb-4">Unbook Recurring Booking</h3>
                <p id="unbookOptionsInfo" class="text-gray-600 mb-4"></p>
                <div class="mb-4">
                    <label class="flex items-center mb-2">
                        <input type="radio" name="unbookOption" value="single" checked class="mr-2">
                        <span class="text-gray-700">Unbook ONLY this instance</span>
                    </label>
                    <label class="flex items-center">
                        <input type="radio" name="unbookOption" value="recurring" class="mr-2">
                        <span class="text-gray-700">Unbook ALL recurring bookings</span>
                    </label>
                </div>
                <div class="flex gap-3">
                    <button 
                        onclick="confirmUnbookOption()" 
                        class="flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-lg transition"
                    >
                        OK
                    </button>
                    <button 
                        onclick="closeUnbookOptionsModal()" 
                        class="flex-1 bg-gray-700 hover:bg-gray-800 text-white font-semibold py-2 px-4 rounded-lg transition"
                    >
                        Cancel
                    </button>
                </div>
            </div>
        </div>

        <!-- Notification Modal -->
        <div id="notificationModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
            <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4 shadow-xl">
                <h3 class="text-xl font-bold text-gray-800 mb-4">Send Notification</h3>
                <p class="text-gray-600 mb-4">Send an email notification about the booking cancellation.</p>
                <div id="notificationDetails" class="bg-gray-100 p-3 rounded mb-4">
                    <p class="text-sm"><strong>Booking:</strong> <span id="notificationBookingName">-</span></p>
                    <p class="text-sm"><strong>Day:</strong> <span id="notificationDay">-</span></p>
                    <p class="text-sm"><strong>Date:</strong> <span id="notificationDate">-</span></p>
                    <p class="text-sm"><strong>Time:</strong> <span id="notificationTime">-</span></p>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Recipient Email:</label>
                    <input 
                        type="email" 
                        id="notificationEmail" 
                        placeholder="Enter recipient email" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>
                <div class="flex gap-3">
                    <button 
                        onclick="sendNotification()" 
                        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition"
                    >
                        Send
                    </button>
                    <button 
                        onclick="closeNotificationModal()" 
                        class="flex-1 bg-gray-700 hover:bg-gray-800 text-white font-semibold py-2 px-4 rounded-lg transition"
                    >
                        Cancel
                    </button>
                </div>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="fixed bottom-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg hidden transition">
            <p id="toastMessage"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
